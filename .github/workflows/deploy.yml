name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync and Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || git branch gh-pages
          git worktree add ../gh-pages-site gh-pages

          # Sync all template folders that contain index.html
          find . -maxdepth 2 -name "index.html" -not -path "*/.*/*" | while read -r idx; do
            dir=$(dirname "$idx")
            if [ "$dir" != "." ]; then
              echo "Syncing template: $dir"
              mkdir -p "../gh-pages-site/$dir"
              cp -r "$dir"/* "../gh-pages-site/$dir/"
            fi
          done

          # Sync root index.html master showcase hub
          if [ -f "index.html" ]; then
            cp index.html ../gh-pages-site/
          fi
          touch ../gh-pages-site/.nojekyll

          cd ../gh-pages-site
          git add -A
          if git diff --staged --quiet; then
            echo "gh-pages is already up to date."
          else
            git commit -m "chore(pages): automated zero-intervention live deployment [skip ci]"
            git push origin gh-pages
            echo "Successfully updated and pushed gh-pages."
          fi
